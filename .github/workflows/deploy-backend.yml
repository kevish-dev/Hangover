name: CI/CD Pipeline

on:
    push:
        branches:
            - main
        paths:
            - 'server/**'
            - '.github/workflows/deploy-backend.yml'
    pull_request:
        branches:
            - main
        paths:
            - 'server/**'
            - '.github/workflows/deploy-backend.yml'

jobs:
    build-and-deploy:
        runs-on: ubuntu-latest

        defaults:
            run:
                working-directory: ./server

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '20'
                  cache: 'npm'
                  cache-dependency-path: server/package-lock.json

            - name: Install dependencies
              run: npm ci

            - name: Create .env file
              if: github.ref == 'refs/heads/main'
              env:
                  ENV_FILE_CONTENT: ${{ secrets.ENV }}
              run: |
                  echo "$ENV_FILE_CONTENT" > .env

            # Note: Omitted 'npm run build' because your Node.js app runs directly using index.js without a build step.

            - name: Copy files to server
              if: github.ref == 'refs/heads/main'
              uses: appleboy/scp-action@v0.1.7
              with:
                  host: ${{ secrets.SSH_HOST }}
                  username: ${{ secrets.SSH_USER }}
                  key: ${{ secrets.SSH_KEY }}
                  # We transfer only what's needed for the backend to run.
                  # scp-action will preserve the 'server' folder structure on the target.
                  source: 'server/index.js,server/package.json,server/package-lock.json,server/.env,server/src,server/prisma.config.js,server/docker-compose.yml'
                  target: '~'

            - name: Execute post-deployment commands
              if: github.ref == 'refs/heads/main'
              uses: appleboy/ssh-action@v1.0.3
              with:
                  host: ${{ secrets.SSH_HOST }}
                  username: ${{ secrets.SSH_USER }}
                  key: ${{ secrets.SSH_KEY }}
                  script: |
                      # Load Node.js environment (for NVM users)
                      export NVM_DIR="$HOME/.nvm"
                      [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
                      
                      # Fallback for standard bash profile
                      source ~/.bash_profile || source ~/.profile || source ~/.bashrc || true
                      
                      # Add standard paths just in case
                      export PATH=$PATH:$HOME/.npm-global/bin:/usr/local/bin:/usr/bin

                      cd ~/server

                      # Install production dependencies
                      npm ci --omit=dev
                      
                      # Ensure database docker container is running
                      docker compose down
                      docker compose up -d
                      
                      # Wait a few seconds for the database to be fully ready
                      sleep 5
                      
                      # Generate Prisma Client and apply migrations
                      npx prisma generate
                      npx prisma migrate deploy

                      pm2 delete hangover-api || true

                      pm2 start index.js --name hangover-api

                      pm2 save
