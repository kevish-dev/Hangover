name: Backend CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "server/**"
      - "monitoring/**"
      - ".github/workflows/**"

  push:
    branches:
      - main
    paths:
      - "server/**"
      - "monitoring/**"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  test:
    name: Test Backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Verify HTTP metric route labels
        run: node --test test/http-metrics.test.js

      # these when available
      # - name: Run Linter
      #   run: npm run lint

      # - name: Run Tests
      #   run: npm test

      # - name: Build Project
      #   run: npm run build
