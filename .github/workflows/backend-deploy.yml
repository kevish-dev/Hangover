
name: Backend Deploy

on:
  workflow_run:
    workflows:
      - Backend CI
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: backend-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Backend

    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Generate Production .env
        env:
          PROD_ENV: ${{ secrets.ENV }}
        run: |
          echo "$PROD_ENV" > .env

      - name: Create Deployment Package
        run: |
          tar \
            --exclude=node_modules \
            --exclude=.git \
            -czf /tmp/backend.tar.gz \
            .
          mv /tmp/backend.tar.gz ./backend.tar.gz

      - name: Upload Deployment Package
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: server/backend.tar.gz
          target: "~/server"
          strip_components: 1

      - name: Deploy on Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e

            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"

            source ~/.bash_profile || source ~/.profile || source ~/.bashrc || true

            export PATH=$PATH:$HOME/.npm-global/bin:/usr/local/bin:/usr/bin

            mkdir -p ~/server
            cd ~/server

            rm -rf index.js src prisma package.json package-lock.json prisma.config.js docker-compose.yml .env

            tar -xzf backend.tar.gz

            rm backend.tar.gz

            npm ci --omit=dev

            docker compose up -d

            echo "Waiting for PostgreSQL to be ready..."
            for i in {1..30}; do
              if docker compose exec -T postgres pg_isready -U admin -d hangover > /dev/null 2>&1; then
                echo "PostgreSQL is ready!"
                break
              fi
              echo "Waiting..."
              sleep 2
            done

            npx prisma generate
            npx prisma migrate deploy

            pm2 reload hangover-api || pm2 start index.js --name hangover-api

            pm2 save